<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNIT FORGE — Combat Simulator</title>
  <link rel="stylesheet" href="STYLE.css">
</head>
<body>
  <div id="app" style="display:flex;flex-direction:column;height:100vh;overflow:hidden"></div>
  <div id="modal"></div>
  <div id="cs-overlay" style="display:none;opacity:0">
    <div class="cs-lb"></div>
    <div class="cs-main">
      <div id="cs-bg-glow" class="cs-bg-glow"></div>
      <div class="cs-portrait-wrap">
        <canvas id="cs-canvas" width="150" height="150"></canvas>
      </div>
      <div class="cs-dialog" id="cs-dialog">
        <div class="cs-speaker" id="cs-speaker"></div>
        <div class="cs-text-wrap">
          <span id="cs-text"></span><span class="cs-cursor" id="cs-cursor">_</span>
        </div>
      </div>
    </div>
    <div class="cs-lb"></div>
    <div class="cs-dots" id="cs-dots"></div>
  </div>
  <script src="APP.js"></script>
</body>
</html>
